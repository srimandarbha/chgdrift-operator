# Umbrella composition for drift-operator deployment
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gitops-fleet

resources:
- namespace.yaml
- ../crd
- ../rbac
- ../manager
- ../networkpolicy
- ../prometheus

labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/name: drift-operator
    app.kubernetes.io/part-of: gitops-fleet
