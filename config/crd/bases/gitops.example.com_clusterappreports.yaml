apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusterappreports.gitops.example.com
spec:
  group: gitops.example.com
  scope: Namespaced
  names:
    kind: ClusterAppReport
    listKind: ClusterAppReportList
    plural: clusterappreports
    singular: clusterappreport
    shortNames: ["car"]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Cluster
          type: string
          jsonPath: .spec.clusterName
        - name: App
          type: string
          jsonPath: .spec.appName
        - name: Revision
          type: string
          jsonPath: .spec.observedRevision
        - name: Sync
          type: string
          jsonPath: .spec.syncStatus
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              required: ["clusterName", "appName", "observedRevision", "observedAt"]
              properties:
                clusterName: { type: string }
                appName: { type: string }
                observedRevision: { type: string }
                syncStatus:
                  type: string
                  enum: ["Synced", "OutOfSync", "Unknown"]
                health:
                  type: string
                  enum: ["Healthy", "Progressing", "Degraded", "Unknown"]
                observedAt:
                  type: string
                  format: date-time
                mcpStatus:
                  type: object
                  properties:
                    name: { type: string }
                    machineCount: { type: integer }
                    updatedNodeCount: { type: integer }
                    updatingNodeCount: { type: integer }
                    unavailableNodeCount: { type: integer }
                    degradedNodeCount: { type: integer }
                    phase: { type: string }
                platformObservation:
                  type: object
                  properties:
                    clusterOperators:
                      type: array
                      items:
                        type: object
                        required: ["name", "available", "degraded"]
                        properties:
                          name: { type: string }
                          available: { type: boolean }
                          degraded: { type: boolean }
                          progressing: { type: boolean }
                          version: { type: string }
                    virtWorkloads:
                      type: object
                      properties:
                        totalVMIs: { type: integer }
                        runningVMIs: { type: integer }
                        liveMigratableVMIs: { type: integer }
                        activeMigrations: { type: integer }
                        stalledMigrations: { type: integer }
                        unmigratableVMIs: { type: integer }
                # Spoke-collected observability data — only populated when
                # the app is OutOfSync or Degraded to keep etcd writes cheap.
                recentEvents:
                  type: array
                  items:
                    type: object
                    required: ["reason", "message", "count", "lastObservedAt", "involvedObject"]
                    properties:
                      reason: { type: string }
                      message: { type: string }
                      count: { type: integer }
                      lastObservedAt: { type: string, format: date-time }
                      involvedObject: { type: string }
                tailLogs:
                  type: array
                  items:
                    type: string
                objectChanges:
                  type: array
                  items:
                    type: object
                    required: ["kind", "name", "changeType"]
                    properties:
                      kind: { type: string }
                      name: { type: string }
                      changeType: { type: string }
                      changedFields:
                        type: array
                        items:
                          type: string
                dependencies:
                  type: array
                  items:
                    type: object
                    required: ["kind", "name", "ready"]
                    properties:
                      kind: { type: string }
                      name: { type: string }
                      ready: { type: boolean }
                      note: { type: string }
                virtStatus:
                  type: object
                  properties:
                    hyperConvergedHealth: { type: string }
                    virtHandlerReady: { type: boolean }
                    activeMigrations: { type: integer }
                    stalledMigrations: { type: integer }
                    unmigratableVMIs: { type: integer }
