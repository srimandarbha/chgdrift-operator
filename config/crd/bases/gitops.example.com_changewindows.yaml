apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: changewindows.gitops.example.com
spec:
  group: gitops.example.com
  scope: Namespaced
  names:
    kind: ChangeWindow
    listKind: ChangeWindowList
    plural: changewindows
    singular: changewindow
    shortNames: ["chgwin"]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: CHG
          type: string
          jsonPath: .spec.chgNumber
        - name: Tag
          type: string
          jsonPath: .spec.releaseTag
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Overall
          type: string
          jsonPath: .status.overallStatus
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              required: ["chgNumber", "releaseTag", "rootApp", "startTime", "endTime"]
              properties:
                chgNumber: { type: string }
                releaseTag: { type: string }
                baselineRevision: { type: string }
                expectedRevision: { type: string }
                rootApp: { type: string }
                impactedApps:
                  type: array
                  items: { type: string }
                startTime: { type: string, format: date-time }
                endTime: { type: string, format: date-time }
                staleReportThresholdSeconds: { type: integer, default: 300 }
                hardRefresh:
                  type: object
                  properties:
                    maxAttempts: { type: integer, default: 2 }
                    waitBetweenSeconds: { type: integer, default: 180 }
                    actionExecutionMode: { type: string, default: "Parked" }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
