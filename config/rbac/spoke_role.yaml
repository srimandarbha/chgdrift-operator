apiVersion: v1
kind: ServiceAccount
metadata:
  name: drift-operator-spoke
  namespace: gitops-fleet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: drift-operator-spoke-role
rules:
  # App descriptor ConfigMaps -- read-only is enough
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]

  # Warning events for the app's namespace(s).
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]

  # Pod status (to find non-Ready pods) and their logs.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  # Dependency checks
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]

  # ClusterAppReport is written by spoke SA.
  - apiGroups: ["gitops.example.com"]
    resources: ["clusterappreports"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  # MachineConfigPool is cluster-scoped.
  - apiGroups: ["machineconfiguration.openshift.io"]
    resources: ["machineconfigpools"]
    verbs: ["get", "list", "watch"]

  # CDI DataVolume checks for virtualization dependency resolution.
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes"]
    verbs: ["get", "list", "watch"]

  # OpenShift Virtualization HyperConverged health check.
  - apiGroups: ["hco.kubevirt.io"]
    resources: ["hyperconvergeds"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: drift-operator-spoke-binding
subjects:
  - kind: ServiceAccount
    name: drift-operator-spoke
    namespace: gitops-fleet
roleRef:
  kind: ClusterRole
  name: drift-operator-spoke-role
  apiGroup: rbac.authorization.k8s.io
